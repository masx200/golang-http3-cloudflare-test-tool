name: Reusable Workflow for IPv6 via WARP

# 定义这个工作流可以被其他工作流调用
on:
  workflow_call:
    # 定义输出，以便调用方可以使用
    outputs:
      ipv6_address:
        description: "The public IPv6 address assigned by WARP"
        value: ${{ jobs.setup-warp.outputs.ipv6_address }}

jobs:
  setup-warp:
    name: Setup IPv6 with WARP
    runs-on: ubuntu-latest
    
    # 定义 job 的输出
    outputs:
      ipv6_address: ${{ steps.verify.outputs.ipv6_address }}

    steps:
    - name: Install Cloudflare WARP
      run: |
        sudo apt-get update
        sudo apt-get install -y curl gnupg lsb-release
        curl -fsSL https://pkg.cloudflare.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflare.com/warp $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
        sudo apt-get update
        sudo apt-get install -y cloudflare-warp

    - name: Register and connect to WARP
      run: |
        echo "--- Registering WARP client ---"
        sudo warp-cli register

        echo "--- Connecting to WARP ---"
        sudo warp-cli connect

        # 初始化循环变量
        MAX_ATTEMPTS=6  # 60 seconds / 10 seconds per attempt
        ATTEMPT=1

        echo "--- Waiting for IPv6 connectivity (max 1 minute) ---"

        while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
          echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Pinging https://ipv6.test-ipv6.com/ via IPv6..."
          
          # 使用 curl -6 强制通过 IPv6 连接，-s 静默模式，-L 跟随重定向
          # 如果 curl 命令成功（返回码为0），则说明连接成功
          if curl -6 -sL -o /dev/null https://ipv6.test-ipv6.com/; then
            echo "✅ IPv6 connectivity is successful!"
            echo "WARP is ready."
            break # 退出循环
          fi

          echo "❌ Attempt $ATTEMPT failed. Waiting for 10 seconds..."
          sleep 10
          ATTEMPT=$((ATTEMPT + 1))
        done

        # 如果循环结束仍未成功，则说明超时
        if [ $ATTEMPT -gt $MAX_ATTEMPTS ]; then
          echo "❌ Error: Failed to establish IPv6 connectivity after 1 minute."
          echo "--- WARP Status for Debugging ---"
          sudo warp-cli status
          exit 1 # 以错误状态退出，使GitHub Actions步骤失败
        fi

    - name: Verify and Capture IPv6 Address
      id: verify # 给这个步骤一个 ID，方便引用其输出
      run: |
        echo "--- WARP Status ---"
        sudo warp-cli status
        
        IPV6_ADDR=$(curl -6 -s https://ifconfig.co)
        echo "Detected IPv6 Address: $IPV6_ADDR"
        
        # 将 IPv6 地址写入到 GITHUB_OUTPUT 文件，以便作为 job 的输出
        echo "ipv6_address=$IPV6_ADDR" >> "$GITHUB_OUTPUT"
